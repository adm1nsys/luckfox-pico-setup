name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: check-image.sh smoke test
        run: |
          mkdir -p t
          printf 'xxxxLuckfox Pico Maxxxxx' > t/boot.img
          printf 'blkdevparts=mmcblk1:32K(env),6G(rootfs) sys_bootargs= root=/dev/mmcblk1p7 rootfstype=ext4\n' > t/env.img
          ./scripts/check-image.sh t | tee out.txt
          grep -q "Luckfox Pico Max" out.txt && grep -q "SD card" out.txt && grep -q "ext4" out.txt
